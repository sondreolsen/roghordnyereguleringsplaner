<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sjekk reisetid pa ny E39!</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <p class="brandline">Stavanger2Bergen</p>
      <h1>Sjekk hvor mye tid du sparer med fremtidens E39!</h1>
      <form id="route-form" class="route-form">
        <label class="field">
          <span>Fra</span>
          <input
            id="from-input"
            name="from"
            type="text"
            placeholder="Åsane"
            required
          >
        </label>

        <label class="field">
          <span>Til</span>
          <input
            id="to-input"
            name="to"
            type="text"
            placeholder="Ålgård"
            required
          >
        </label>

        <div class="actions">
          <button type="submit" id="submit-button">Se reisetid!</button>
        </div>
      </form>
      <div class="savings-card">
        <span class="savings-label">Du sparer</span>
        <strong id="savings-output">-</strong>
      </div>
    </header>

    <main class="map-grid">
      <section class="map-card">
        <div class="map-card-header">
          <div class="map-title-row">
            <div>
              <p class="map-eyebrow">Dagens E39</p>
            </div>
            <div class="time-pill">
              <strong id="current-duration-output">-</strong>
              <small id="current-distance-output">-</small>
            </div>
          </div>
        </div>
        <div class="map-canvas-wrap">
          <div id="current-map" class="map-frame" aria-label="Kart for dagens vegnett"></div>
          <section class="map-type-picker map-type-picker-floating" aria-label="Velg karttype">
            <div class="picker-options">
              <label class="map-type-option">
                <input type="radio" name="map-type" value="standard" checked>
                <span class="map-type-card standard-preview">Standard</span>
              </label>
              <label class="map-type-option">
                <input type="radio" name="map-type" value="satellite">
                <span class="map-type-card satellite-preview">Satelitt</span>
              </label>
            </div>
          </section>
        </div>
      </section>

      <section class="map-card future-map-card">
        <div class="map-card-header">
          <div class="map-title-row">
            <div>
              <p class="map-eyebrow">Fremtidens E39</p>
            </div>
            <div class="time-pill future-pill">
              <strong id="future-duration-output">-</strong>
              <small id="future-distance-output">-</small>
            </div>
          </div>
        </div>
        <div id="future-map" class="map-frame" aria-label="Kart for framtidig vegnett"></div>
      </section>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./app.js"></script>
</body>
</html>
